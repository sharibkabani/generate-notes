<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COURSE Exam Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Restyle per course: swap these three families for the course's identity. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: lab notebook. Sticky header with a scrollable tab bar over one working surface per tab; notes get a sticky TOC on wide screens. (Rewrite this line for each course's concept.) */
:root{
  --paper:#F5F7FB; --panel:#FFFFFF; --ink:#18203A; --muted:#5B6584; --line:#D8DEEC; --grid:#E6EBF5;
  --accent:#2C47D6; --accent-ink:#FFFFFF; --mark:#FFE15A; --mark-soft:#FFF4B8;
  --good:#1D8A55; --good-soft:#E3F5EB; --bad:#C2372F; --bad-soft:#FBE7E5; --warn:#B26A00; --warn-soft:#FDF0D5;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --head:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1320; --panel:#171C2D; --ink:#E5E9F5; --muted:#9AA3BE; --line:#2B3350; --grid:#1D2338;
  --accent:#8EA0FF; --accent-ink:#0F1320; --mark:#E8C53A; --mark-soft:#3A3416;
  --good:#5BD597; --good-soft:#15301F; --bad:#FF867C; --bad-soft:#3A1A18; --warn:#F2B35A; --warn-soft:#352A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1320; --panel:#171C2D; --ink:#E5E9F5; --muted:#9AA3BE; --line:#2B3350; --grid:#1D2338;
  --accent:#8EA0FF; --accent-ink:#0F1320; --mark:#E8C53A; --mark-soft:#3A3416;
  --good:#5BD597; --good-soft:#15301F; --bad:#FF867C; --bad-soft:#3A1A18; --warn:#F2B35A; --warn-soft:#352A12; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--head) + 16px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.5rem,3vw,1.9rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700} h4{font-size:1rem;font-weight:700}
p{margin:0} a{color:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font:600 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:1.06rem;color:var(--muted);max-width:68ch}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.cols>*,.stack>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.graph{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}

/* ---------- header + scrollable tab bar ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:8px 16px;padding-block:10px;flex-wrap:wrap}
.brand{font:800 1.05rem/1 var(--display);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .tag{font:600 .7rem/1 var(--mono);background:var(--ink);color:var(--panel);padding:4px 6px;border-radius:3px}
.topright{margin-left:auto;display:flex;gap:10px;align-items:center}
.mini{font:600 .8rem/1 var(--mono);color:var(--muted);white-space:nowrap}
.mini b{color:var(--bad)}
.tabwrap{position:relative;flex:1 1 100%;order:10;min-width:0;display:flex;align-items:center}
@media (min-width:1000px){.tabwrap{flex:1 1 0;order:0}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;cursor:grab}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs.drag{cursor:grabbing}
nav.tabs button{background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:6px;font-weight:500;white-space:nowrap;font-size:.95rem}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--mark-soft);box-shadow:inset 0 -2px 0 var(--mark)}
.tabwrap::before,.tabwrap::after{content:"";position:absolute;top:0;bottom:0;width:34px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
.tabwrap::before{left:0;background:linear-gradient(90deg,var(--panel),transparent)}
.tabwrap::after{right:0;background:linear-gradient(-90deg,var(--panel),transparent)}
.tabwrap.l::before,.tabwrap.r::after{opacity:1}
.tabarr{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:700 1rem/1 var(--body);display:none;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgb(0 0 0/.12)}
.tabarr.prev{left:0}.tabarr.next{right:0}
.tabwrap.l .tabarr.prev,.tabwrap.r .tabarr.next{display:flex}

main{padding-block:28px 64px}
section.tab{display:grid;gap:28px}

/* ---------- buttons, chips, inputs ---------- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:7px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;background:var(--panel)}
.chip.yes{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.chip.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.85rem}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--mark-soft)}
input[type=number],input[type=text],select,textarea{font:500 1rem var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{display:grid;gap:4px}.field label{font:600 .74rem/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}

/* ---------- brief ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:780px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2rem,5.5vw,3.3rem);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--mark) 55%,transparent) 58%)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;margin:0}
.facts dt{font:600 .74rem/1.9 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0}
.clock{display:flex;gap:10px;flex-wrap:wrap}
.clock div{background:var(--paper);border-radius:8px;padding:10px 12px;min-width:68px;text-align:center}
.clock b{display:block;font:700 1.7rem/1 var(--mono);font-variant-numeric:tabular-nums}
.clock span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.scope .panel{display:grid;gap:8px;align-content:start}
.scope .k{font:600 .72rem/1 var(--mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.recipe{counter-reset:r;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.recipe li{counter-increment:r;display:grid;grid-template-columns:2rem 1fr;gap:10px}
.recipe li::before{content:counter(r);font:800 1rem/1.6rem var(--display);width:1.8rem;height:1.8rem;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%}
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,130px) 1fr 40px;gap:10px;align-items:center;font-size:.9rem}
.brow .track{height:14px;background:var(--paper);border-radius:4px;overflow:hidden}
.brow .fill{height:100%;background:var(--accent);border-radius:4px}
.brow .n{text-align:right}

/* ---------- study plan ---------- */
.plan{display:grid;gap:12px}
.day{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
@media (max-width:640px){.day{grid-template-columns:1fr;gap:6px}}
.day .d{font:600 .8rem/1.4 var(--mono);color:var(--muted)} .day .d b{display:block;color:var(--ink);font-size:1rem}
.day.today .panel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.day.past{opacity:.7}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.task:first-of-type{border-top:0}
.task .min{font:500 .8rem var(--mono);color:var(--muted);white-space:nowrap}
.tagx{font:600 .66rem/1 var(--mono);padding:3px 5px;border-radius:3px;background:var(--warn-soft);color:var(--warn);margin-right:6px;vertical-align:1px}
.task.done span.t{text-decoration:line-through;color:var(--muted)}

/* ---------- notes ---------- */
.notes-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.notes-layout{grid-template-columns:minmax(0,1fr)}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head) + 12px);display:grid;align-content:start;gap:2px;font-size:.92rem;max-height:calc(100vh - env(safe-area-inset-top,0px) - var(--head) - 32px);overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scrollbar-width:thin}
.toc-h{font:600 .68rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:14px 10px 6px}
.toc-h:first-child{padding-top:0}
.toc a{color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--accent)}
.toc a.on{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--panel)}
.toc a.qb-link{font-family:var(--mono);font-size:.82rem}
article.note{display:grid;gap:14px;padding-bottom:28px;border-bottom:1px dashed var(--line);scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--head) + 20px)}
article.note>*,.notes-layout>*{min-width:0}
article.note p,article.note li{max-width:70ch}
article.note ul,article.note ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.big-idea{font-size:1.06rem;font-weight:500;padding-left:14px;border-left:3px solid var(--accent);max-width:68ch}
.def{border-left:3px solid var(--accent);padding:6px 0 6px 12px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.callout{border-left:4px solid var(--mark);background:var(--mark-soft);padding:12px 14px;border-radius:0 8px 8px 0}
.callout.warn{border-left-color:var(--bad);background:var(--bad-soft)}
.omit{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
.ex{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;line-height:1.8}
.ex .ex-h{display:block;margin-bottom:8px;font:600 .85rem/1.4 var(--mono);color:var(--accent)}
details.cy{border:1px dashed var(--line);border-radius:8px;background:var(--panel)}
details.cy>summary{cursor:pointer;padding:10px 14px;font-weight:500}
details.cy>*:not(summary){padding:0 14px 12px}
.src{font-size:.8rem;color:var(--muted)}
pre.code{font:14px/1.55 var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0;overflow-x:auto;white-space:pre;tab-size:4}
.ex pre.code{background:var(--panel)}
.code .kw{color:var(--accent);font-weight:600} .code .cm{color:var(--muted);font-style:italic}
:not(pre)>code{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.93rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{font:600 .74rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right}
/* math helpers: stacked fraction, sigma with limits, step-by-step equation rows */
sup,sub{line-height:0;font-size:.72em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.25;text-align:center;font-size:.95em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em .06em}
.fr>span:last-child{padding:.06em .3em 0}
.sm{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .3em 0 .1em;line-height:1}
.sm .s{font:400 2.1em/1 "Cambria Math","STIX Two Math",Georgia,serif}
.sm .u,.sm .l{font-size:.75em;line-height:1.15;white-space:nowrap}
.eqs{display:grid;gap:12px;margin:6px 0}
.eqr{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:2px 6px;align-items:center}
.eqr>.eq0{text-align:center}
.eqr>.eqn{grid-column:2;font-size:.9rem;color:var(--muted)}
.eq{font:500 1.2rem/1.5 var(--mono);text-align:center;padding:12px;overflow-x:auto;white-space:nowrap}
/* figures sit on white plates even in dark mode: slide art assumes white */
figure{margin:0;display:grid;gap:6px}
figure .plate{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;justify-content:center;cursor:zoom-in}
figure img{display:block;max-width:100%;height:auto;max-height:440px}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:.84rem;color:var(--muted)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}

/* ---------- quiz engine (practice + quiz breaks) ---------- */
.quiz{display:grid;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qtext{font-size:1.08rem;font-weight:600;max-width:72ch}
.qtext pre.code{margin-top:10px;font-weight:400;font-size:13.5px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;font:1rem/1.45 var(--body);display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.opt .k{font:600 .9rem/1.45 var(--mono);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.explain{display:grid;gap:6px;padding:12px 14px;border-radius:8px;background:var(--paper);font-size:.96rem}
.explain .res{font:700 .78rem var(--mono);letter-spacing:.06em;text-transform:uppercase}
.explain .res.ok{color:var(--good)} .explain .res.no{color:var(--bad)}
.big{font:800 3rem/1 var(--display)}
.qbreak{border:2px solid var(--ink);border-radius:12px;padding:18px;display:grid;gap:12px;background:var(--panel);scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--head) + 20px)}
.qbreak .verdict{border-radius:8px;padding:10px 12px;font-weight:600}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- flashcards ---------- */
.card3d{perspective:1200px;cursor:pointer;max-width:640px;width:100%;margin:0 auto}
.card3d .inner{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.card3d.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;place-content:center;text-align:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);text-align:left}
.face .term{font:800 clamp(1.4rem,4vw,2.1rem)/1.1 var(--display)}

/* ---------- labs ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:860px){.lab{grid-template-columns:minmax(0,1fr)}}
.lab>*{min-width:0}
.chart{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.chart text{fill:var(--muted);font:12px var(--mono)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.readout div{background:var(--paper);border-radius:8px;padding:8px 10px}
.readout span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.readout b{font:700 1.1rem/1.3 var(--mono);font-variant-numeric:tabular-nums}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:60;background:rgb(10 12 20/.88);display:grid;grid-template-rows:auto 1fr auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 12px;gap:8px}
.lbbar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font:600 .85rem var(--mono);flex-wrap:wrap}
.lbbar button{background:rgb(255 255 255/.12);border:1px solid rgb(255 255 255/.25);color:#fff;border-radius:6px;padding:6px 10px}
.lb .stage{overflow:auto;display:grid;place-items:center}
.lb .sheet{background:#fff;border-radius:8px;padding:12px;max-width:min(1100px,100%)}
.lb img{display:block;max-width:100%;max-height:calc(100vh - 160px);height:auto;cursor:zoom-in}
.lb.zoom .sheet{max-width:none}.lb.zoom img{max-width:none;max-height:none;width:200%;cursor:zoom-out}
.lb .cap{color:#e8e8ee;font-size:.9rem;text-align:center;margin:0}

/* ---------- pomodoro ---------- */
.pomo-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font:600 .82rem/1 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.pomo-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pomo-pill[data-run="1"][data-mode="focus"] .dot{background:var(--bad)}
.pomo-pill[data-run="1"]:not([data-mode="focus"]) .dot{background:var(--good)}
.pomo{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + var(--head) + 8px);z-index:35;width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgb(0 0 0/.18);padding:18px;display:grid;gap:12px}
.pomo h4{display:flex;justify-content:space-between;align-items:center}
.pomo .x{border:0;background:none;font-size:1.3rem;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:7px 11px;font:600 .82rem/1 var(--body)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t b{font:700 1.9rem/1 var(--mono);font-variant-numeric:tabular-nums}
.ring .t span{font-size:.75rem;color:var(--muted)}
.tally{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tally i{width:12px;height:12px;border-radius:3px;background:var(--line)} .tally i.on{background:var(--bad)}

footer.foot{border-top:1px solid var(--line);padding-block:20px 40px;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap topbar">
    <div class="brand"><span class="tag" id="brandTag">CODE</span><span id="brandName">Exam Lab</span></div>
    <div class="tabwrap" id="tabwrap">
      <button class="tabarr prev" type="button" aria-label="Scroll sections left">‹</button>
      <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
      <button class="tabarr next" type="button" aria-label="Scroll sections right">›</button>
    </div>
    <div class="topright">
      <span class="mini" id="miniCount"></span>
      <button class="pomo-pill" id="pomoPill" aria-expanded="false" aria-controls="pomo" data-mode="focus" data-run="0" hidden><span class="dot" aria-hidden="true"></span><span id="pomoPillT">Focus 25:00</span></button>
    </div>
  </div>
</header>

<aside class="pomo" id="pomo" hidden aria-label="Pomodoro timer">
  <h4>Pomodoro <button class="x" id="pomoClose" aria-label="Close timer">×</button></h4>
  <div class="seg" id="pomoModes" role="group" aria-label="Timer mode"><button data-m="focus" aria-pressed="true">Focus</button><button data-m="short" aria-pressed="false">Short break</button><button data-m="long" aria-pressed="false">Long break</button></div>
  <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="9"/><circle id="pomoArc" cx="60" cy="60" r="52" fill="none" stroke="var(--bad)" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0"/></svg>
    <div class="t"><b id="pomoTime">25:00</b><span id="pomoLabel">Focus</span></div></div>
  <div class="row" style="justify-content:center"><button class="btn primary" id="pomoStart">Start</button><button class="btn" id="pomoReset">Reset</button><button class="btn" id="pomoSkip">Skip</button></div>
  <div class="field"><label for="pomoTask">Working on</label><select id="pomoTask"></select></div>
  <div class="stack" style="gap:6px"><span class="eyebrow">Today</span><div class="tally" id="pomoTally"></div><span class="small muted" id="pomoLog"></span></div>
  <details><summary class="small muted" style="cursor:pointer">Settings</summary>
    <div class="cols" style="margin-top:8px;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div class="field"><label for="pomoF">Focus</label><input id="pomoF" type="number" min="1" max="90"></div>
      <div class="field"><label for="pomoS">Short</label><input id="pomoS" type="number" min="1" max="30"></div>
      <div class="field"><label for="pomoL">Long</label><input id="pomoL" type="number" min="1" max="60"></div></div>
    <label class="check small" style="margin-top:8px"><input type="checkbox" id="pomoSound"> Chime when a session ends</label>
    <label class="check small"><input type="checkbox" id="pomoAuto"> Start the next session automatically</label>
  </details>
</aside>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Enlarged figure">
  <div class="lbbar"><span id="lbPos"></span><span class="row"><button id="lbPrev" aria-label="Previous figure">←</button><button id="lbZoom">Zoom 2×</button><button id="lbNext" aria-label="Next figure">→</button><button id="lbClose" aria-label="Close">Close ✕</button></span></div>
  <div class="stage" id="lbStage"><div class="sheet"><img id="lbImg" alt=""></div></div>
  <p class="cap" id="lbCap"></p>
</div>

<main class="wrap" id="main">
  <!-- Each tab is a <section class="tab" id="tab-ID">. app.js fills the standard ones from data.js; labs.js fills #tab-labs. -->
  <section class="tab" id="tab-brief"></section>
  <section class="tab" id="tab-plan" hidden></section>
  <section class="tab" id="tab-notes" hidden></section>
  <section class="tab" id="tab-labs" hidden></section>
  <section class="tab" id="tab-practice" hidden></section>
  <section class="tab" id="tab-cards" hidden></section>
  <section class="tab" id="tab-formulas" hidden></section>
</main>

<footer class="foot"><div class="wrap" id="footText"></div></footer>

<!-- If the course needs heavy math, publish MathJax's tex-svg.js as a local file and uncomment:
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{enableMenu:false}};</script>
<script src="tex-svg.js" async></script> -->
<script src="data.js"></script>
<script src="labs.js"></script>
<script src="app.js"></script>
</body>
</html>
